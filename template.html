<!DOCTYPE html>
<html lang="{{LANG}}" data-scroll="{{SCROLL}}" data-motion="{{MOTION}}" data-interactive="{{INTERACTIVE}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
{{HEAD}}
<style>
/* ==== slideck-html template.html — FROZEN. Jangan edit per deck. ==== */
/* Font theme default di-inline base64 oleh build.js dari assets/fonts/. Theme lain pakai font sistem. */
{{FONTS}}
/* Viewport-base: fixed 1920x1080 stage, scaled. */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1116}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#0b1116}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--surface,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--surface,#fff);transition:opacity .45s ease}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
/* slide selalu bertumpuk di stage, walau design menulis .slide{position:relative} (spesifisitas lebih tinggi dari .slide) */
.deck-stage>.slide{position:absolute;inset:0}
/* ==== TOKENS + KOMPONEN (frozen) ==== */
{{COMPONENTS}}
/* ==== CHROME (di luar stage) ==== */
/* petunjuk navigasi ringkas: pil kecil samar "6 / 19"; petunjuk tombol muncul saat hover/fokus atau beberapa detik pertama */
.deck-controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:1000;color:#fff;font-size:13px;line-height:1;background:rgba(0,0,0,.45);padding:7px 12px;border-radius:99px;opacity:.28;white-space:nowrap;transition:opacity .3s,padding .3s;cursor:default}
.deck-controls .hint{display:inline-block;max-width:0;overflow:hidden;vertical-align:bottom;transition:max-width .4s ease}
.deck-controls:hover,.deck-controls:focus-within,.deck-controls.intro,body.editing .deck-controls{opacity:1;padding:7px 16px}
.deck-controls:hover .hint,.deck-controls.intro .hint{max-width:640px}
.deck-controls #editflag{display:none;color:#5EA8A7;font-weight:800}
body.editing .slide{outline:3px dashed var(--teal);outline-offset:-10px}
.progress{position:fixed;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.15);z-index:1001}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s var(--ease)}
/* ==== REDUCED MOTION: matikan transform + transisi reveal ==== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1!important;transform:none!important}
}
/* ==== SCROLL: layar sempit / potret → slide ditumpuk dan digulir seperti halaman (deck.json "scroll": "auto"|"on"|"off") ==== */
html.scroll,html.scroll body{height:auto;overflow-x:hidden;overflow-y:auto}
html.scroll .deck-viewport{position:relative;inset:auto}
html.scroll .deck-stage{height:auto;background:transparent}
html.scroll .deck-stage>.slide{position:relative;inset:auto;visibility:visible;opacity:1;pointer-events:auto;margin-bottom:40px}
html.scroll .reveal{opacity:1!important;transform:none!important}
html.scroll .deck-controls,html.scroll .progress{display:none}
/* ==== CLEAN: ?clean di URL → tanpa UI (untuk tangkapan layar dan embed) ==== */
html.clean .deck-controls,html.clean .progress,html.clean .deck-theme-switcher{display:none!important}
/* ==== PRINT: satu slide per halaman, semua terlihat ==== */@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;background:#fff}
  .deck-viewport{position:static;overflow:visible;background:#fff;height:auto!important}
  .deck-stage{position:static;transform:none!important;width:1920px;height:auto;background:#fff}
  .slide,.deck-stage>.slide{position:relative;inset:auto;visibility:visible!important;opacity:1!important;pointer-events:auto;page-break-after:always;break-after:page;width:1920px;height:1080px;margin:0!important}
  .reveal{opacity:1!important;transform:none!important}
  .deck-controls,.progress{display:none!important}
}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage">
{{SLIDES}}
</div></div>
<div class="progress"><i id="bar"></i></div>
<div class="deck-controls intro" id="ctl"><span id="pg" aria-live="polite">1 / 1</span><span class="hint">&nbsp;· {{HINT}}</span> <span id="editflag">· EDIT ON</span></div>
<script>setTimeout(()=>document.getElementById('ctl').classList.remove('intro'),3500)</script>
<script>
/* ==== NAV (frozen) ==== */
const R=document.documentElement;if(/[?&]clean\b/.test(location.search))R.classList.add('clean');let scrollMode=false;
function wantScroll(){const m=R.dataset.scroll||'auto';if(matchMedia('print').matches)return false;return m==='on'||(m!=='off'&&matchMedia('(max-width:820px),(orientation:portrait) and (max-width:1100px)').matches)}
let cur=0;const slides=[...document.querySelectorAll('.slide')];const pg=document.getElementById('pg');const bar=document.getElementById('bar');
function fit(){const st=document.getElementById('stage'),vp=st.parentNode,was=scrollMode;scrollMode=wantScroll();R.classList.toggle('scroll',scrollMode);
  if(scrollMode){const k=R.clientWidth/1920;st.style.transform='scale('+k+')';slides.forEach(x=>{x.classList.add('active','visible');x.setAttribute('aria-hidden','false')});vp.style.height=(st.offsetHeight*k)+'px';return}
  vp.style.height='';modes();if(was)go(cur,0);const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
/* ==== MOTION v2 + STEPS (frozen) — docs/motion.md ====
   html.m-anim  : animasi isi + transisi slide aktif (motion v2 terpasang, durasi > 0, bukan reduced-motion/gulir/edit/final)
   html.m-steps : data-step disembunyikan sampai dibuka dengan klik / → (bukan mode gulir / final)
   html.m-final : semua tampil dalam keadaan akhir (?final, mode edit, alat check/pptx, print) */
const RM=matchMedia('(prefers-reduced-motion: reduce)');let inited=false,finalLock=/[?&]final\b/.test(location.search);
function tok(n,d){const v=getComputedStyle(R).getPropertyValue(n).trim();if(!v)return d;const x=parseFloat(v);return isNaN(x)?d:(/ms$/.test(v)?x:/s$/.test(v)?x*1000:x)}
function modes(){const fin=finalLock||isEditing();R.classList.toggle('m-final',fin);R.classList.toggle('m-anim',!fin&&!scrollMode&&!RM.matches&&tok('--m-dur',0)>0);R.classList.toggle('m-steps',!fin&&!scrollMode)}
const LIST='.grid2,.grid3,.grid4,.rows,.timeline,.chips,.bands,.checklist,.thumbs,.facts,.stack,.cta-row,.hero,.with-aside,.cols,ul,ol';
function unitsOf(root,out,depth){if(!root.firstElementChild){out.push(root);return}for(const c of root.children){if(c.matches('script,style,br,.foot,svg.connector,.connector'))continue;if(c.hasAttribute('data-step')||c.hasAttribute('data-morph'))continue;
  if(depth<2&&c.matches(LIST)&&c.children.length>1&&!c.hasAttribute('data-steps')){unitsOf(c,out,depth+1);continue}out.push(c)}}
function chor(sl){const out=[],pad=sl.querySelector(':scope>.pad');
  if(pad&&pad.classList.contains('lay')){for(const ph of pad.children){if(!ph.classList.contains('ph')||ph.hasAttribute('data-step'))continue;const w=ph.firstElementChild;if(w&&w.matches('.bul')&&ph.matches('.ph-body,.ph-left,.ph-right,.ph-caption,.ph-picture'))unitsOf(w,out,0);else unitsOf(ph,out,1)}}

  const n=out.length;sl.style.setProperty('--m-k',n>9?(9/n).toFixed(3):1);out.forEach((el,i)=>{el.setAttribute('data-m','');el.style.setProperty('--i',Math.min(i,16))});

/* stack: .swap / .tabs — keadaan bertumpuk; kontrol dibuat dari data-label anak-anaknya */
function stackOf(el){return el.classList.contains('tabs')?[...el.querySelector(':scope>.tab-panels').children]:[...el.children].filter(c=>!c.matches('.swap-ctl'))}
function ctlOf(el){if(el.classList.contains('tabs'))return el.querySelector(':scope>.tab-list');const p=el.previousElementSibling;return p&&p.matches('.swap-ctl')?p:null}
function setState(el,k){const st=stackOf(el);k=Math.max(0,Math.min(st.length-1,k));el._k=k;st.forEach((c,i)=>{c.classList.toggle('on',i===k);c.setAttribute('aria-hidden',i===k?'false':'true')});const ctl=ctlOf(el);if(ctl)[...ctl.children].forEach((b,i)=>{b.setAttribute(el.classList.contains('tabs')?'aria-selected':'aria-pressed',i===k?'true':'false');b.tabIndex=i===k?0:-1})}
function buildStacks(){
  document.querySelectorAll('.tabs').forEach((t,ti)=>{if(t.querySelector(':scope>.tab-list'))return;const panels=[...t.children];const list=document.createElement('div');list.className='tab-list';list.setAttribute('role','tablist');const wrap=document.createElement('div');wrap.className='tab-panels';
    panels.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=p.dataset.label||p.dataset.tab||String(i+1);const id='tp'+ti+'-'+i;p.id=p.id||id;p.setAttribute('role','tabpanel');b.setAttribute('aria-controls',p.id);
      b.addEventListener('click',e=>{setState(t,i);if(e.detail)b.blur()});if(t.hasAttribute('data-hover'))b.addEventListener('mouseenter',()=>setState(t,i));list.appendChild(b);wrap.appendChild(p)});
    t.append(list,wrap);setState(t,0)});
  document.querySelectorAll('.swap').forEach(s=>{if(s._k!==undefined)return;const st=stackOf(s);if(!s.hasAttribute('data-step')){const ctl=document.createElement('div');ctl.className='swap-ctl';ctl.setAttribute('role','group');
      st.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=c.dataset.label||String(i+1);b.addEventListener('click',e=>{setState(s,i);if(e.detail)b.blur()});if(s.hasAttribute('data-hover'))b.addEventListener('mouseenter',()=>setState(s,i));ctl.appendChild(b)});s.parentNode.insertBefore(ctl,s)}setState(s,0)});
  document.querySelectorAll('.peek').forEach(p=>{p.tabIndex=0;p.setAttribute('role','button');p.addEventListener('click',()=>{if(!isEditing())p.classList.toggle('open')});p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();p.classList.toggle('open')}})});
  document.querySelectorAll('.focus-group>*').forEach(c=>{if(c.tabIndex<0&&!c.matches('a,button'))c.tabIndex=0});
  document.querySelectorAll('.hotspot').forEach(h=>{if(h.querySelector('.hs-tip'))return;const tip=document.createElement('span');tip.className='hs-tip';while(h.firstChild)tip.appendChild(h.firstChild);h.appendChild(tip);h.tabIndex=0;h.setAttribute('role','button');h.setAttribute('aria-label',tip.textContent.trim());h.addEventListener('click',()=>h.classList.toggle('open'));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();h.classList.toggle('open')}})})}
/* steps: langkah berurutan per slide. data-step="n" mengatur urutan (sama = bersamaan), data-steps pada wadah = tiap anak satu langkah,

  sl.querySelectorAll('[data-steps]').forEach(c=>{const dim=c.dataset.steps==='dim';for(const ch of c.children){if(!ch.hasAttribute('data-step'))ch.setAttribute('data-step','');if(dim)ch.setAttribute('data-dim','')}});
  const items=[];let last=0;sl.querySelectorAll('[data-step]').forEach(el=>{if(el.parentElement&&el.parentElement.closest('[data-step]:not(.swap):not(.tabs)')&&!el.closest('[data-steps]'))return;const v=parseFloat(el.dataset.step);let n=isNaN(v)?last+1:v;
    if(el.matches('.swap,.tabs')){const k=stackOf(el).length;for(let j=1;j<k;j++)items.push({n:n+j-1,el,t:'s',k:j});last=Math.max(last,n+k-2)}else{items.push({n,el,t:'v'});last=Math.max(last,n)}});

  const ks=new Map();G.forEach((g,i)=>g.forEach(a=>{if(a.t==='s'){if(!ks.has(a.el))ks.set(a.el,0);if(i<si)ks.set(a.el,a.k)}}));ks.forEach((k,el)=>setState(el,k))}
function stepsReset(sl,all){const G=stepsOf(sl);if(!G.length)return;sl._si=all?G.length:0;stepPaint(sl)}
function stepNext(){const sl=slides[cur],G=stepsOf(sl);if(!R.classList.contains('m-steps')||sl._si>=G.length)return false;sl._si++;stepPaint(sl);hashSync();return true}
function stepPrev(){const sl=slides[cur],G=stepsOf(sl);if(!R.classList.contains('m-steps')||!G.length||sl._si<=0)return false;sl._si--;stepPaint(sl);hashSync();return true}
/* alamat: #N = slide N, #N.k = slide N dengan k langkah terbuka (untuk berbagi tautan dan tangkapan layar per langkah) */
function hashSync(){const sl=slides[cur],G=stepsOf(sl),k=G.length?sl._si:0;try{history.replaceState(null,'','#'+(cur+1)+(k>0?'.'+k:''))}catch(e){}}
function parseHash(){const m=/^#(\d+)(?:\.(\d+))?$/.exec(location.hash);return m?{n:+m[1]-1,k:m[2]===undefined?null:+m[2]}:null}
function goHash(h){if(!h)return;if(h.n!==cur||!inited)go(h.n,1);if(h.k!==null&&R.classList.contains('m-steps')){const sl=slides[cur],G=stepsOf(sl);sl._si=Math.max(0,Math.min(G.length,h.k));stepPaint(sl);hashSync()}}
/* keadaan .swap/.tabs selain yang tampil → halaman salinan saat print/PDF/PPTX/check, agar isinya tidak hilang.
   data-print="first" | "last" pada komponen: cukup satu keadaan itu, tanpa salinan. */
function expandStates(){if(document.querySelector('.deck-stage>.slide.m-copy'))return;
  slides.forEach((s,si)=>{const comps=[...s.querySelectorAll('.swap,.tabs')];let after=s;
    comps.forEach((c,ci)=>{const mode=c.dataset.print||'all',st=stackOf(c);if(mode==='first'){setState(c,0);return}if(mode==='last'){setState(c,st.length-1);return}
      const on=c._k||0;st.forEach((p,k)=>{if(k===on)return;const cp=s.cloneNode(true);cp.classList.add('m-copy');cp.classList.remove('active','visible');cp.removeAttribute('data-notes');cp.setAttribute('aria-hidden','true');
        cp.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));cp.dataset.copyOf=si+1;cp.dataset.state=p.dataset.label||String(k+1);setState(cp.querySelectorAll('.swap,.tabs')[ci],k);after.after(cp);after=cp})})});

function collapseStates(){document.querySelectorAll('.deck-stage>.slide.m-copy').forEach(e=>e.remove())}
function next(skip){if(!skip&&stepNext())return;if(cur<slides.length-1)go(cur+1,1)}
function prev(skip){if(!skip&&stepPrev())return;if(cur>0)go(cur-1,-1)}
/* data-count: angka dihitung naik saat slide dimainkan maju (format mengikuti bahasa deck) */
function countUp(sl,play){sl.querySelectorAll('[data-count]').forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let tn;while((tn=w.nextNode())&&!/\d/.test(tn.nodeValue));if(!tn)return;if(tn._src===undefined)tn._src=tn.nodeValue;cancelAnimationFrame(el._raf);tn.nodeValue=tn._src;if(!play)return;
  const src=tn._src,m=src.match(/\d[\d.,]*/);if(!m)return;const id=(R.lang||'id').slice(0,2)==='id',dec=id?',':'.',tho=id?'.':',',raw=m[0].replace(/[.,]$/,'');const parts=raw.split(dec),nd=parts.length>1?parts[1].length:0,target=parseFloat(parts[0].split(tho).join('')+(nd?'.'+parts[1]:''));if(!isFinite(target))return;
  const fmt=new Intl.NumberFormat(id?'id-ID':'en-US',{minimumFractionDigits:nd,maximumFractionDigits:nd,useGrouping:raw.includes(tho)});const host=el.closest('[data-m]')||el,i=parseFloat(getComputedStyle(host).getPropertyValue('--i'))||0;
  const delay=tok('--m-start',0)+i*tok('--m-stagger',0)*(parseFloat(getComputedStyle(sl).getPropertyValue('--m-k'))||1),dur=tok('--m-count-dur',1200),t0=performance.now()+delay;

  slides.forEach(s=>{if(s!==to&&s!==from){s.classList.remove('active','visible','m-on','m-done','m-enter','m-leave')}});
  if(from&&from!==to){from.classList.remove('active','visible','m-enter');from.setAttribute('aria-hidden','true');clearTimeout(from._lt);
    if(anim){from.classList.add('m-leave');from._lt=setTimeout(()=>from.classList.remove('m-leave','m-on','m-done'),tok('--m-slide-out',240)+80)}else from.classList.remove('m-leave','m-on','m-done')}

function tryMorph(from,to,dir){if(!document.startViewTransition||!R.classList.contains('m-anim'))return false;const a=new Map();from.querySelectorAll('[data-morph]').forEach(e=>a.set(e.dataset.morph,e));

  vt.finished.finally(()=>pairs.forEach(([,nw])=>nw.style.viewTransitionName=''));return true}
function go(n,dir){n=Math.max(0,Math.min(slides.length-1,n));const from=slides[cur];if(dir===undefined)dir=n>=cur?1:-1;cur=n;
  if(scrollMode){slides[cur].scrollIntoView();return}
  const to=slides[cur],anim=inited&&from!==to&&dir!==0&&R.classList.contains('m-anim');
  if(!(anim&&tryMorph(from,to,dir)))swapSlides(from,to,dir===0?(to.classList.contains('m-on')?-1:1):dir,anim);

/* keadaan akhir untuk alat (check, pptx, PDF, thumbnail): semua langkah terbuka, swap/tabs di keadaan pertama (terakhir bila
   digerakkan langkah), keadaan lainnya jadi halaman salinan (.m-copy, data-copy-of, data-state) */
window.slideckFinal=function(){finalLock=true;modes();slides.forEach(s=>{stepsReset(s,true);s.querySelectorAll('.swap:not([data-step]),.tabs:not([data-step])').forEach(c=>setState(c,0));s.classList.add('m-on','m-done','m-settled')});expandStates()};
function isEditing(){return document.body.classList.contains('editing')}
function setEdit(on){document.body.classList.toggle('editing',on);document.body.contentEditable=on?'true':'false';document.getElementById('editflag').style.display=on?'inline':'none';modes()}
addEventListener('resize',fit);addEventListener('beforeprint',()=>{if(scrollMode){R.classList.remove('scroll');document.getElementById('stage').style.transform='none'}});addEventListener('afterprint',fit);
addEventListener('keydown',e=>{
  if(isEditing()){if(e.key==='Escape'){e.preventDefault();setEdit(false)}return}
  if(scrollMode)return;
  if(e.target.closest&&e.target.closest('.tab-list,.swap-ctl,.peek,.hotspot')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next(e.shiftKey)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev(e.shiftKey)}
  else if(e.key==='Home'){e.preventDefault();go(0,1)}
  else if(e.key==='End'){e.preventDefault();go(slides.length-1,-1)}
  else if(e.key.toLowerCase()==='e'){setEdit(true)}
});
slides.forEach(s=>s.addEventListener('click',(e)=>{if(isEditing()||scrollMode)return;if(e.target.closest('.deck-controls,a,button,.cmd,input,select,.peek,.hotspot,.tab-list,.swap-ctl'))return;const r=s.getBoundingClientRect();const leftSide=(e.clientX-r.left)/r.width<0.3;if(leftSide)prev();else next()}));
let sx=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(scrollMode)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){if(dx<0)next();else prev()}},{passive:true});
/* ==== COPY: klik .cmd menyalin teksnya (atau data-copy) ==== */
document.addEventListener('click',e=>{const c=e.target.closest('.cmd');if(!c||isEditing())return;const t=c.dataset.copy||c.textContent.trim();if(!navigator.clipboard)return;navigator.clipboard.writeText(t).then(()=>{c.classList.add('copied');setTimeout(()=>c.classList.remove('copied'),1500)}).catch(()=>{})});
/* ==== AUTOFIT (frozen): seperti "Shrink text on overflow" PowerPoint. Konten yang meluber dikecilkan dengan CSS zoom
   (teks + jarak ikut mengecil, lebar tetap). Matikan per slide dengan data-fit="off". Batas bawah 0.55. ==== */
const FIT_MIN=0.55;
function stageK(sl){return sl.getBoundingClientRect().width/1920||1}
function fitTargets(sl){const t=[];for(const c of sl.children){if(c.matches('.foot,.connector,.lay,script,style'))continue;const p=getComputedStyle(c).position;if(p==='absolute'||p==='fixed')continue;if(c.classList.contains('pad')&&c.children.length)t.push(...c.children);else t.push(c)}return t}
function hasText(el){for(const n of el.childNodes){if(n.nodeType===3&&n.nodeValue.trim())return true}return false}
function slideOverflows(sl){const k=stageK(sl),R=sl.getBoundingClientRect(),e=1.5*k;const foot=sl.querySelector(':scope>.foot');const fr=foot?[...foot.children].map(c=>c.getBoundingClientRect()).filter(r=>r.width>0):[];let bad=false;
  (function walk(el,top){for(const c of el.children){if(bad)return;if(c.matches('.foot,.connector,.lay,script,style'))continue;const p=getComputedStyle(c).position;if(p==='absolute'||p==='fixed')continue;const r=c.getBoundingClientRect();if(!r.width&&!r.height)continue;
    const leaf=c.matches('svg,img,table,.shape')||hasText(c);
    if(leaf){if(r.bottom>R.bottom+e||r.top<R.top-e||r.right>R.right+e||r.left<R.left-e){bad=true;return}
      for(const f of fr){if(r.bottom>f.top+e&&r.top<f.bottom-e&&r.right>f.left+e&&r.left<f.right-e){bad=true;return}}}
    if(!c.matches('svg,img,.shape'))walk(c,false)}})(sl,true);
  return bad}
/* luber placeholder = kotak anak keluar dari kotak .ph (bukan scrollHeight: tinta glyph dengan line-height rapat ikut terhitung) */
function phOver(ph){const R=ph.getBoundingClientRect(),e=1.5*stageK(ph.closest('.slide')||ph);for(const c of ph.children){const r=c.getBoundingClientRect();if(!r.width&&!r.height)continue;if(r.bottom>R.bottom+e||r.right>R.right+e||r.top<R.top-e||r.left<R.left-e)return true}return false}
function searchFit(targets,over,host){targets.forEach(t=>t.style.zoom='');host.removeAttribute('data-fit-scale');host.removeAttribute('data-fit-fail');if(!targets.length||!over())return;
  let lo=FIT_MIN,hi=1;for(let i=0;i<7;i++){const m=(lo+hi)/2;targets.forEach(t=>t.style.zoom=m);if(over())hi=m;else lo=m}
  targets.forEach(t=>t.style.zoom=lo);host.setAttribute('data-fit-scale',lo.toFixed(3));if(over())host.setAttribute('data-fit-fail','1')}
function fitSlide(sl){if(sl.dataset.fit==='off')return;
  sl.querySelectorAll('.ph').forEach(ph=>{if(ph.dataset.fit==='off')return;searchFit([...ph.children],()=>phOver(ph),ph)});
  searchFit(fitTargets(sl),()=>slideOverflows(sl),sl)}
/* ==== CONNECTOR (frozen): garis antar elemen, digambar dari posisi nyata. ==== */
function drawConnectors(sl){sl.querySelectorAll('svg.connector').forEach(sv=>{const k=stageK(sl),o=sv.getBoundingClientRect(),S=sl.getBoundingClientRect();let a,b,hz;
  const box=q=>{let el=null;try{el=sl.querySelector(q)}catch(e){}if(!el)return null;const r=el.getBoundingClientRect();return{l:(r.left-o.left)/k,t:(r.top-o.top)/k,r:(r.right-o.left)/k,b:(r.bottom-o.top)/k,cx:(r.left+r.width/2-o.left)/k,cy:(r.top+r.height/2-o.top)/k}};
  if(sv.dataset.xy){const v=sv.dataset.xy.split(',').map(Number),ox=(S.left-o.left)/k,oy=(S.top-o.top)/k;a=[v[0]+ox,v[1]+oy];b=[v[2]+ox,v[3]+oy];hz=Math.abs(b[0]-a[0])>=Math.abs(b[1]-a[1])}
  else{const A=box(sv.dataset.from),B=box(sv.dataset.to);if(!A||!B){sv.innerHTML='';sv.setAttribute('data-missing','1');return}
    const gx=Math.max(B.l-A.r,A.l-B.r),gy=Math.max(B.t-A.b,A.t-B.b),g=6;hz=gx>=gy;
    if(hz){const d=B.cx>=A.cx;a=[d?A.r+g:A.l-g,A.cy];b=[d?B.l-g:B.r+g,B.cy]}else{const d=B.cy>=A.cy;a=[A.cx,d?A.b+g:A.t-g];b=[B.cx,d?B.t-g:B.b+g]}}
  const type=sv.dataset.type||'straight',arrow=sv.dataset.arrow||'end',H=20;let u;
  if(type==='straight'){const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;u=[(b[0]-a[0])/L,(b[1]-a[1])/L]}else u=hz?[Math.sign(b[0]-a[0])||1,0]:[0,Math.sign(b[1]-a[1])||1];
  const ae=arrow==='end'||arrow==='both',as=arrow==='start'||arrow==='both';
  const p0=as?[a[0]+u[0]*H*.8,a[1]+u[1]*H*.8]:a,p1=ae?[b[0]-u[0]*H*.8,b[1]-u[1]*H*.8]:b,f=n=>Math.round(n*10)/10;let d='M'+f(p0[0])+' '+f(p0[1]);
  if(type==='elbow'){if(hz){const m=(p0[0]+p1[0])/2;d+='H'+f(m)+'V'+f(p1[1])+'H'+f(p1[0])}else{const m=(p0[1]+p1[1])/2;d+='V'+f(m)+'H'+f(p1[0])+'V'+f(p1[1])}}
  else if(type==='curve'){if(hz){const m=(p0[0]+p1[0])/2;d+='C'+f(m)+' '+f(p0[1])+' '+f(m)+' '+f(p1[1])+' '+f(p1[0])+' '+f(p1[1])}else{const m=(p0[1]+p1[1])/2;d+='C'+f(p0[0])+' '+f(m)+' '+f(p1[0])+' '+f(m)+' '+f(p1[0])+' '+f(p1[1])}}
  else d+='L'+f(p1[0])+' '+f(p1[1]);
  const head=(t,s)=>{const bx=t[0]-s*u[0]*H,by=t[1]-s*u[1]*H,nx=-u[1]*H*.45,ny=u[0]*H*.45;return '<path class="cn-h" d="M'+f(t[0])+' '+f(t[1])+'L'+f(bx+nx)+' '+f(by+ny)+'L'+f(bx-nx)+' '+f(by-ny)+'Z"/>'};
  let h='<path class="cn-l" d="'+d+'"/>'+(ae?head(b,1):'')+(as?head(a,-1):'');
  if(sv.dataset.label){const t=document.createElement('span');t.textContent=sv.dataset.label;h+='<text x="'+f((a[0]+b[0])/2)+'" y="'+f((a[1]+b[1])/2)+'">'+t.innerHTML+'</text>'}
  sv.innerHTML=h;sv.removeAttribute('data-missing')})}
function layoutAll(){const all=document.querySelectorAll('.deck-stage>.slide');all.forEach(fitSlide);all.forEach(drawConnectors)}
window.slideckFit=layoutAll;
let fitTimer=0;addEventListener('input',()=>{clearTimeout(fitTimer);fitTimer=setTimeout(()=>{fitSlide(slides[cur]);drawConnectors(slides[cur])},250)});
addEventListener('hashchange',()=>goHash(parseHash()));
buildStacks();slides.forEach(chor);modes();RM.addEventListener&&RM.addEventListener('change',modes);

fit();const H0=parseHash();cur=H0?Math.max(0,Math.min(slides.length-1,H0.n)):0;go(cur,1);inited=true;if(H0&&H0.k!==null)goHash(H0);if(finalLock)window.slideckFinal();layoutAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutAll);
