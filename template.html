<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ==== slideck-html template.html — FROZEN. Jangan edit per deck. ==== */
/* Font theme default di-inline base64 oleh build.js dari assets/fonts/. Theme lain pakai font sistem. */
{{FONTS}}
/* Viewport-base: fixed 1920x1080 stage, scaled. */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1116}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#0b1116}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--surface,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--surface,#fff);transition:opacity .45s ease}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
/* ==== TOKENS + KOMPONEN (frozen) ==== */
{{COMPONENTS}}
/* ==== CHROME (di luar stage) ==== */
.deck-controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;color:#fff;font-size:17px;background:rgba(0,0,0,.5);padding:10px 22px;border-radius:99px}
.deck-controls #editflag{display:none;color:#5EA8A7;font-weight:800}
body.editing .slide{outline:3px dashed var(--teal);outline-offset:-10px}
.progress{position:fixed;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.15);z-index:1001}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s var(--ease)}
/* ==== REDUCED MOTION: matikan transform + transisi reveal ==== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1!important;transform:none!important}
}
/* ==== PRINT: satu slide per halaman, semua terlihat ==== */
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;background:#fff}
  .deck-viewport{position:static;overflow:visible;background:#fff}
  .deck-stage{position:static;transform:none!important;width:1920px;height:auto;background:#fff}
  .slide{position:relative;visibility:visible!important;opacity:1!important;pointer-events:auto;page-break-after:always;break-after:page;width:1920px;height:1080px}
  .reveal{opacity:1!important;transform:none!important}
  .deck-controls,.progress{display:none!important}
}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage">
{{SLIDES}}
</div></div>
<div class="progress"><i id="bar"></i></div>
<div class="deck-controls"><span id="pg" aria-live="polite">1 / 1</span> · ← → / Space navigasi · E edit teks <span id="editflag">· EDIT ON</span></div>
<script>
/* ==== NAV (frozen) ==== */
let cur=0;const slides=[...document.querySelectorAll('.slide')];const pg=document.getElementById('pg');const bar=document.getElementById('bar');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);const st=document.getElementById('stage');st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{const on=i===cur;s.classList.toggle('active',on);s.classList.toggle('visible',on);s.setAttribute('aria-hidden',on?'false':'true')});pg.textContent=(cur+1)+' / '+slides.length;bar.style.width=((cur+1)/slides.length*100)+'%'}
function isEditing(){return document.body.classList.contains('editing')}
function setEdit(on){document.body.classList.toggle('editing',on);document.body.contentEditable=on?'true':'false';document.getElementById('editflag').style.display=on?'inline':'none'}
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(isEditing()){if(e.key==='Escape'){e.preventDefault();setEdit(false)}return}
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home'){e.preventDefault();go(0)}
  else if(e.key==='End'){e.preventDefault();go(slides.length-1)}
  else if(e.key.toLowerCase()==='e'){setEdit(true)}
});
slides.forEach(s=>s.addEventListener('click',(e)=>{if(isEditing())return;if(e.target.closest('.deck-controls,a,button'))return;const r=s.getBoundingClientRect();const leftSide=(e.clientX-r.left)/r.width<0.3;go(cur+(leftSide?-1:1))}));
let sx=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1))},{passive:true});
fit();go(0);
</script>
</body>
</html>
