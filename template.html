<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* ==== slideck-html template.html — FROZEN. Jangan edit per deck. ==== */
/* Viewport-base: fixed 1920x1080 stage, scaled. Tidak ikut export. */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1116}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#0b1116}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#fff}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:#fff;transition:opacity .45s ease}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}
/* ==== TOKENS (frozen, 1:1 dengan PPTX NAVY/TEAL/GREY/MUT) ==== */
{{COMPONENTS}}
/* ==== CHROME (di luar stage, tidak ikut export) ==== */
.deck-controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;color:#fff;font-size:17px;background:rgba(0,0,0,.5);padding:10px 22px;border-radius:99px}
.progress{position:fixed;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.15);z-index:1001}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s var(--ease)}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage">
{{SLIDES}}
</div></div>
<div class="progress"><i id="bar"></i></div>
<div class="deck-controls"><span id="pg">1 / 1</span> · ← → / Space navigasi · E edit teks</div>
<script>
/* ==== NAV (frozen, bug backward sudah fix) ==== */
let cur=0;const slides=[...document.querySelectorAll('.slide')];const pg=document.getElementById('pg');const bar=document.getElementById('bar');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);const st=document.getElementById('stage');st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.classList.toggle('active',i===cur);s.classList.toggle('visible',i===cur)});pg.textContent=(cur+1)+' / '+slides.length;bar.style.width=((cur+1)/slides.length*100)+'%'}
addEventListener('resize',fit);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}else if(e.key.toLowerCase()==='e'){document.body.contentEditable=document.body.contentEditable!=='true'}});
slides.forEach(s=>s.addEventListener('click',(e)=>{if(document.body.contentEditable==='true')return;if(e.target.closest('.deck-controls,a,button'))return;const r=s.getBoundingClientRect();const leftSide=(e.clientX-r.left)/r.width<0.3;go(cur+(leftSide?-1:1))}));
let sx=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1))},{passive:true});
fit();go(0);
</script>
</body>
</html>
